# 依据当前 chezmoi 已纳管的配置推导
# 分组的唯一含义是「从哪个仓库装」：
#   pacman      = 官方 / CachyOS 仓库
#   archlinuxcn = [archlinuxcn] 仓库
#   shorin      = [shorin-arch] 仓库（个别包 CachyOS 仓库也有）
#   aur         = AUR（依赖 paru）
# 组内按用途分块，块内按字母序。
packages:
  arch:
    pacman:
      # ---------- shell / 提示符：.bashrc .bash_profile .zshrc .config/fish ----------
      - bash
      - bat
      - eza
      - fish
      - fzf
      - starship
      - zsh
      - zoxide

      # ---------- 编辑器 / 工具链：.vimrc .config/nvim .clang-format .config/clangd .gdbinit ----------
      - clang
      - gdb
      - neovim
      - vim

      # ---------- 终端：.config/alacritty .config/kitty ----------
      - alacritty
      - kitty

      # ---------- niri 桌面：.config/{niri,matugen,fuzzel,satty,xsettingsd} ----------
      - fuzzel
      - matugen
      - niri
      - satty
      - xorg-xhost                # niri 启动时 xhost +si:localuser:root
      - xsettingsd

      # ---------- AUR 助手（CachyOS 仓库自带） ----------
      - paru
      - yay

      # ---------- GTK 主题：.config/gtk-3.0 .config/gtk-4.0 ----------
      - gtk3
      - gtk4

      # ---------- XDG：.config/user-dirs.dirs .config/xdg-desktop-portal ----------
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - gnome-keyring
      - xdg-user-dirs

      # ---------- 输入法：.config/fcitx5（fcitx5 本体见 shorin 组） ----------
      - fcitx5-chinese-addons
      - fcitx5-configtool
      - fcitx5-gtk
      - fcitx5-qt

      # ---------- TUI：.config/{btop,cava,yazi} ----------
      - btop
      - cava
      - yazi

      # ---------- 浏览器：.config/chromium-flags.conf ----------
      - chromium

      # ---------- 虚拟化：.config/libvirt ----------
      - libvirt

      # ---------- SSH：.ssh ----------
      - openssh

      # ---------- .local/bin / .config/scripts 里实际调用的命令 ----------
      - curl
      - ffmpeg
      - grim
      - imagemagick
      - jq
      - libnotify
      - python
      - slurp
      - wf-recorder
      - wl-clipboard
      - wtype                      # dux-shell 粘贴剪贴板历史

      # ---------- 字体：fontconfig ----------
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - ttf-fira-code
      - ttf-firacode-nerd
      - ttf-jetbrains-mono-nerd

      # ---------- 音频：cava / pipewire ----------
      - pipewire
      - pipewire-pulse
      - wireplumber

      # ---------- 杂项 ----------
      - fastfetch
      - fd
      - gvfs
      - lazygit
      - lua51
      - luarocks
      - tectonic
      - tree-sitter-cli
      - unzip
      - wget

    # 来自 [archlinuxcn]，标准 Arch 没有这些包
    archlinuxcn:
      - xdg-desktop-portal-termfilechooser   # .config/xdg-desktop-portal-termfilechooser

    # 来自 [shorin-arch]，标准 Arch 没有这些包
    shorin:
      # dms 桌面外壳
      - dux-shell                             # /usr/bin/dms（CachyOS 仓库也有）
      - dux-search-bin                        # /usr/bin/dsearch
      - quickshell-git                        # dms 依赖
      - shorin-dux-niri-git                   # 提供 shorindms 和默认配置

      # 其他工具
      - fcitx5-shorin-patched-git             # 提供 fcitx5 本体
      - miyu                                  # 终端 AI 助手
      - shorin-pac-git                        # 下载器

      # 终端字体
      - ttf-jetbrains-maple-mono-nf-xx-xx

    # 目前没有必须走 AUR 的；以后有就加在这里
    aur: []

    user_services:
      - pipewire-pulse.socket

    # 需要 root 的系统服务
    system_services:
      - libvirtd.socket
      - sshd.service

    # 需要把当前用户加入的附加组（重新登录后生效）
    user_groups:
      - libvirt
